name: metrics

# renders GitHub stats as SVG and commits them into assets/.
# README then points at files that live in this repo, so nothing on the
# profile depends on a third-party server staying online.
#
# requires a CLASSIC personal access token in secrets.METRICS_TOKEN
# (fine-grained tokens cannot authenticate against the GitHub GraphQL API).
# Scopes: read:user  (+ repo only if you also want private-repo stats)

on:
  schedule:
    - cron: "00 4 * * *" # daily, 04:00 UTC - no need to hammer the API
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # both jobs push commits - keep them sequential
      matrix:
        include:
          - theme: default
            filename: assets/metrics.light.svg
          - theme: dark
            filename: assets/metrics.dark.svg
    steps:
      - name: Render metrics (${{ matrix.theme }})
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DmytroPalahin
          filename: ${{ matrix.filename }}
          config_timezone: Europe/Paris
          config_theme: ${{ matrix.theme }}
          base: header, activity, community, repositories

          # Language breakdown, weighted so generated files don't dominate.
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex, xslt, scss, makefile
          plugin_languages_sections: most-used

          # Contribution calendar over the last year.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # When you actually commit - recruiters like this one.
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          commit_message: "chore(metrics): refresh ${{ matrix.theme }} render"
