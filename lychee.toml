# Link checker config — https://lychee.cli.rs
max_redirects = 5
timeout = 20
retry_wait_time = 2
max_retries = 3
accept = ["200..=299", "403", "429"]

# LinkedIn and Telegram bounce automated requests; that's not a broken link.
exclude = [
  "^https://www\\.linkedin\\.com",
  "^https://t\\.me",
  # TODO: remove this line once uvkit is published publicly.
  "^https://github\\.com/DmytroPalahin/uvkit",
]
